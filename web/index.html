<!doctype html>
<meta charset="utf-8" />
<title>账单助手</title>
<form id="f">
  <input name="q" placeholder="问账单" />
  <button>发送</button>
</form>
<pre id="out"></pre>
<script>
  const api = "http://127.0.0.1:8787";
  f.onsubmit = async (e) => {
    e.preventDefault();
    out.textContent = "…";
    const res = await fetch(api + "/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ prompt: f.q.value }),
    });
    const data = await res.json();
    out.textContent = data.answer;
  };
</script>
