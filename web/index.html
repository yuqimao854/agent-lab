<form id="f">
  <input name="q" placeholder="问账单" />
  <button type="submit">发送</button>
  <button type="button" id="stopBtn">停止</button>
</form>
<pre id="out"></pre>
<script>
  const api = 'http://127.0.0.1:8787';
  let current = null;

  stopBtn.onclick = () => current?.abort();

  f.onsubmit = async (e) => {
    e.preventDefault();
    current?.abort();
    current = new AbortController();
    out.textContent = '…';
    try {
      const res = await fetch(api + '/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ prompt: f.q.value }),
        signal: current.signal,
      });
      out.textContent = '';
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        out.textContent += decoder.decode(value);
      }
    } catch (err) {
      if (err.name === 'AbortError') out.textContent = '已取消。';
      else out.textContent = String(err);
    }
  };
</script>
